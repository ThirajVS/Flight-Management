spring:
  datasource:
    url: jdbc:h2:mem:aerocadet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: test-only-aerocadet-jwt-secret-with-at-least-32-characters
      expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:3000

